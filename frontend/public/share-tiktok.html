<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="tiktok.metaShare">Share to TikTok — Wikigai</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/brand/favicon.png">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/survey.css">
<link rel="stylesheet" href="/assets/ikigai.css">
<link rel="stylesheet" href="/assets/wk.css">
<link rel="stylesheet" href="/assets/legal.css">
<link rel="stylesheet" href="/assets/tiktok-share.css">
<script src="/assets/i18n/i18n.js" data-content="taxonomy,careers"></script>
<script src="/assets/track.js" defer></script>
</head>
<body class="survey-body ik-body">
<div id="wkNav"></div>
<!-- v20261112b: "Share to TikTok" — the user posts their own result carousel to their own TikTok.
     The post screen follows TikTok's Content Sharing Guidelines (creator info, privacy chosen by hand with no default,
     interactions off by default, commercial-content disclosure, Music Usage Confirmation before the Post button). -->
<main class="ik-main" style="padding-top:90px">
  <div class="results-wrap lg-wrap">
    <header class="ik-head">
      <div class="ik-kicker" data-i18n="tiktok.shareKicker">📲 Share</div>
      <h1 data-i18n-html="tiktok.shareTitle">Share to <span class="grad">TikTok</span></h1>
      <p data-i18n="tiktok.shareLead">Post your Wikigai as a photo carousel on your own TikTok. You choose everything before it is sent.</p>
    </header>
    <div id="ttApp" class="ik-card ts-card" aria-live="polite"><p class="dl-help" data-i18n="common.loading">Loading…</p></div>
  </div>
</main>
<script src="/assets/app.js"></script>
<script src="/assets/site.js"></script>
<script src="/assets/survey-data.js"></script>
<script src="/assets/oauth.js"></script>
<script src="/assets/tiktok-share.js"></script>
</body>
</html>
