<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm your email — Wikigai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/brand/favicon.png">
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body>
<div class="auth-shell">
  <div class="narrow auth-card">
    <div class="auth-head">
      <div class="logo" style="justify-content:center;margin-bottom:16px"><img class="brand-logo" src="/assets/brand/wikigai-logo.png" alt="Wikigai" style="height:44px"></div>
      <div class="progress-steps"><span class="step-dot active"></span><span class="step-dot active"></span></div>
      <h2>Check your inbox</h2>
      <p>Enter the 6-digit code we sent to <b id="emailShown">your email</b></p>
    </div>

    <div class="card card-pad">
      <div class="alert" id="alert"></div>
      <div id="devPin" class="alert alert-info"></div>
      <form id="verifyForm">
        <div class="pin-row" id="pinRow"></div>
        <div class="err-msg" id="ePin" style="text-align:center"></div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn" style="margin-top:14px">Verify &amp; continue</button>
      </form>
      <div class="switch-line">
        Didn't get it? <a href="#" id="resendLink">Resend code</a>
      </div>
    </div>
    <p class="hint" style="text-align:center;margin-top:16px"><a href="/signup">← Use a different email</a></p>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
  const { api, setupPinRow, showAlert, hideAlert, Store } = window.CPS;
  const alertEl = document.getElementById('alert');
  const devPinEl = document.getElementById('devPin');
  const form = document.getElementById('verifyForm');
  const btn = document.getElementById('submitBtn');
  const email = sessionStorage.getItem('cps_pending_email');

  if (!email) window.location.href = '/signup';
  document.getElementById('emailShown').textContent = email || 'your email';

  const devPin = sessionStorage.getItem('cps_dev_pin');
  if (devPin) { devPinEl.className = 'alert show alert-info'; devPinEl.textContent = 'Preprod code (dev): ' + devPin; }

  let pin;
  pin = setupPinRow('pinRow', () => form.requestSubmit());
  pin.focus();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert(alertEl);
    document.getElementById('ePin').textContent = '';
    const code = pin.value();
    if (code.length !== 6) { document.getElementById('ePin').textContent = 'Enter all 6 digits.'; return; }
    btn.disabled = true; btn.textContent = 'Verifying…';
    try {
      const res = await api('/api/auth/verify', { method: 'POST', auth: false, body: { email, pin: code } });
      Store.token = res.token; Store.user = res.user;
      sessionStorage.removeItem('cps_pending_email');
      sessionStorage.removeItem('cps_dev_pin');
      window.location.href = '/dashboard';
    } catch (err) {
      showAlert(alertEl, err.message, 'err');
      pin.clear();
      btn.disabled = false; btn.textContent = 'Verify & continue';
    }
  });

  document.getElementById('resendLink').addEventListener('click', async (e) => {
    e.preventDefault();
    hideAlert(alertEl);
    try {
      const res = await api('/api/auth/resend', { method: 'POST', auth: false, body: { email } });
      showAlert(alertEl, res.message || 'A new code has been sent.', 'ok');
      if (res.dev_pin) { devPinEl.className = 'alert show alert-info'; devPinEl.textContent = 'Preprod code (dev): ' + res.dev_pin; }
    } catch (err) { showAlert(alertEl, err.message, 'err'); }
  });
</script>
</body>
</html>
